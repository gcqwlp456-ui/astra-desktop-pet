<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Astra · 清晰度优化预览</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eeeaf5;color:#302c43;font:16px/1.6 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1060px;margin:40px auto;padding:24px}header{display:flex;justify-content:space-between;align-items:end}h1{font-size:38px;margin:0}header p{color:#756c89;margin:4px 0 24px}.layout{display:grid;grid-template-columns:1.2fr 1fr;gap:24px}.panel{background:#fff9;border:1px solid #fff;border-radius:24px;padding:24px;box-shadow:0 12px 50px #32224b0a}.stage{min-height:470px;display:grid;place-items:center;background-color:#f4f2fa;background-image:linear-gradient(45deg,#e6e1ef 25%,transparent 25%),linear-gradient(-45deg,#e6e1ef 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e6e1ef 75%),linear-gradient(-45deg,transparent 75%,#e6e1ef 75%);background-size:32px 32px;background-position:0 0,0 16px,16px -16px,-16px 0;border-radius:18px}.stage.dark{background:#252334}.stage.white{background:#fff}canvas{width:384px;height:416px;max-width:100%;object-fit:contain}button,select{font:inherit;border:1px solid #dcd4e9;border-radius:12px;padding:10px 14px;background:#fff;cursor:pointer;color:inherit}button.active{background:#64517e;color:white;border-color:#64517e}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:9px}h2{font-size:18px;margin:0 0 14px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.muted{color:#776e86;font-size:14px}input[type=range]{width:100%;accent-color:#786192}.downloads{display:flex;gap:14px;margin-top:22px;flex-wrap:wrap}a{color:#66507f}#caption{min-height:55px}footer{margin-top:22px;color:#776e86;font-size:13px}@media(max-width:760px){main{margin:0}.layout{grid-template-columns:1fr}.stage{min-height:420px}h1{font-size:30px}}</style>
<main><header><div><h1>Astra · 白龙娘</h1><p>银白长发，蓝色眼睛，一点点小傲娇。</p></div><span class="muted">清晰度优化版</span></header>
<div class="layout"><section class="panel"><div id="stage" class="stage"><canvas id="pet" width="384" height="416"></canvas></div><div class="controls"><button id="play">暂停</button><button id="step">下一帧</button><select id="background" aria-label="背景"><option value="">透明棋盘</option value="dark">深色背景</option><option value="white">白色背景</option></select><select id="quality" aria-label="素材精度"><option value="hd">高精度放大预览</option value="native">桌宠实际帧</option></select><select id="speed" aria-label="速度"><option value="1">正常速度</option><option value=".5">半速检查</option><option value="1.5">1.5 倍速</option></select></div><p id="frame" class="muted"></p><input id="seek" type="range" min="0" max="5" value="0" aria-label="动画帧"></section>
<section class="panel"><h2>选择动作</h2><div id="states" class="buttons"></div><p id="caption" class="muted"></p><div class="downloads"><a href="previews/astra-clarity.mp4">全部动作 MP4</a><a href="previews/idle.webp">透明待机动画</a><a href="final/spritesheet-clarity-v2.png" download>透明精灵图</a></div><p class="muted">困倦是额外动画素材，没有绑定到 Codex 的独立状态。视线方向按 16 帧顺序播放。</p></section></div><footer>放大预览从原始大图直接导出，每帧 384×416；桌宠安装素材受应用限制，每帧 192×208。可切换“桌宠实际帧”对比；触发与播放速度由 Codex 控制。</footer></main>
<script>
const defs=[['idle','待机',0,[280,110,110,140,140,320],'轻轻呼吸、眨眼。'],['running-right','向右移动',1,Array(8).fill(120),'向右迈出小步。'],['running-left','向左移动',2,Array(8).fill(120),'向左迈出小步。'],['waving','开心挥手',3,[140,140,140,280],'微笑，挥手，小翅膀轻动。'],['jumping','轻轻跃起',4,[140,140,140,140,280],'离地、回落，恢复原来的站立位置。'],['failed','惊讶与受挫',5,[140,140,140,140,140,140,140,240],'短暂惊讶后露出困扰的表情。'],['waiting','等待回应',6,[150,150,150,150,150,260],'坐下，用尾巴围住身体，等你回应。'],['running','翻书工作',7,[120,120,120,120,120,220],'认真翻阅小书，偶尔抬头。'],['review','思考复核',8,[150,150,150,150,150,280],'歪头，手指轻碰脸颊。'],['look','视线方向',9,Array(16).fill(180),'从上方开始，顺时针看向 16 个方向。'],['sleepy','困倦（额外）',0,[420,300,320,420,650,400],'打个小哈欠，安静合眼。额外素材，未绑定原生状态。']];
const image=new Image(),sleep=new Image(),native=new Image(),nativeSleep=new Image(); image.src='final/spritesheet-preview-2x.png';sleep.src='extras/sleepy-strip-2x.png';native.src='final/spritesheet-clarity-v2.png';nativeSleep.src='extras/sleepy-strip.png';const ctx=document.querySelector('canvas').getContext('2d');let current=0,index=0,playing=true,last=performance.now(),acc=0;const seek=document.querySelector('#seek');
defs.forEach((d,i)=>{const b=document.createElement('button');b.textContent=d[1];b.onclick=()=>select(i);document.querySelector('#states').appendChild(b)});
function select(i){current=i;index=0;acc=0;seek.max=defs[i][3].length-1;document.querySelector('#caption').textContent=defs[i][4];[...document.querySelector('#states').children].forEach((b,j)=>b.classList.toggle('active',j===i));draw()}
function draw(){const d=defs[current],isLook=d[0]==='look',isSleep=d[0]==='sleepy',row=isLook?9+Math.floor(index/8):d[2],col=isLook?index%8:index,hi=document.querySelector('#quality').value==='hd',f=hi?2:1,src=isSleep?(hi?sleep:nativeSleep):(hi?image:native);ctx.canvas.width=192*f;ctx.canvas.height=208*f;ctx.clearRect(0,0,192*f,208*f);if(src.complete&&src.naturalWidth)ctx.drawImage(src,col*192*f,row*208*f,192*f,208*f,0,0,192*f,208*f);document.querySelector('#frame').textContent=d[1]+' · '+(index+1)+' / '+d[3].length+(isLook?' · '+(index*22.5)+'°':'');seek.value=index}
function tick(t){if(playing){acc+=(t-last)*Number(document.querySelector('#speed').value);const ds=defs[current][3];while(acc>=ds[index]){acc-=ds[index];index=(index+1)%ds.length}draw()}last=t;requestAnimationFrame(tick)}
function pause(){playing=false;document.querySelector('#play').textContent='播放'}document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'暂停':'播放'};document.querySelector('#step').onclick=()=>{pause();index=(index+1)%defs[current][3].length;draw()};seek.oninput=()=>{pause();index=Number(seek.value);draw()};document.querySelector('#background').onchange=e=>document.querySelector('#stage').className='stage '+e.target.value;document.querySelector('#quality').onchange=draw;image.onload=draw;sleep.onload=draw;native.onload=draw;nativeSleep.onload=draw;select(0);requestAnimationFrame(tick);
</script></html>
